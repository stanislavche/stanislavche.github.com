<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link id="dynamic-favicon" rel="shortcut icon" href="/favicon/0.gif" />
		<link rel="canonical" href="https://s-tn.space" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>
		<meta name="theme-color" content="#000000" />
		<link id="pwa-manifest" rel="manifest" href="/manifest.json" />
		<!-- PWA override for /cms — runs sync before Safari reads head -->
		<script>
			(function() {
				var p = window.location.pathname;
				if (p.indexOf('/cms') === 0 || p.indexOf('/admin') === 0) {
					var m = document.getElementById('pwa-manifest');
					if (m) m.setAttribute('href', '/cms/manifest.json');
					var icon = document.createElement('link');
					icon.rel = 'apple-touch-icon';
					icon.href = '/cms/icon.png';
					document.head.appendChild(icon);
					[
						['apple-mobile-web-app-capable',          'yes'],
						['apple-mobile-web-app-status-bar-style', 'black-translucent'],
						['apple-mobile-web-app-title',            'S_TN Admin'],
						['mobile-web-app-capable',                'yes'],
						['theme-color',                           '#0d0d0d'],
					].forEach(function(pair) {
						var t = document.createElement('meta');
						t.name = pair[0]; t.content = pair[1];
						document.head.appendChild(t);
					});
					document.title = 'S_TN Admin';
					// Inline preloader — показывается до того как React смонтируется
					var style = document.createElement('style');
					style.textContent = '@keyframes _cmspin{to{transform:rotate(360deg)}}@keyframes _cmpulse{0%,100%{opacity:1}50%{opacity:.35}}#cms-pl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0d0010;gap:20px}#cms-pl-ring{width:52px;height:52px;border:3px solid rgba(243,46,146,.18);border-top-color:#f32e92;border-radius:50%;animation:_cmspin .85s linear infinite}#cms-pl-text{color:#f32e92;font-size:12px;letter-spacing:3px;text-transform:uppercase;animation:_cmpulse 1.6s ease-in-out infinite}';
					document.head.appendChild(style);
					var root = document.getElementById('root');
					if (root) root.innerHTML = '<div id="cms-pl"><div id="cms-pl-ring"></div><span id="cms-pl-text">LOADING...</span></div>';
				}
			})();
		</script>
		<title>S_TN Official web site</title>
		<!--OG-->
		<meta property="og:title" content="S_TN" />
		<meta property="og:type" content="website" />
		<meta property="og:description" content="Chip-musician from Russian Federation" />
		<meta property="og:url" content="https://s-tn.space/" />
		<meta property="og:image" content="https://s-tn.space/stress_tn.jpg" />
		<script>
			(function(){
				var data = {
					"@context": "http://schema.org",
					"@type": "MusicGroup",
					"@id": "https://musicbrainz.org/artist/2a19a020-f1ea-45ee-aa16-547c1a87920a",
					"name": "Stress_TN",
					"alternateName": "StanChe",
					"description": "Chiptune musician from Russia",
					"logo": {
						"@type": "ImageObject",
						"url": "https://s-tn.space/stress_tn.jpg"
					},
					"image": {
						"@type": "ImageObject",
						"url": "https://s-tn.space/stress_tn.jpg"
					},
					"url": "https://s-tn.space",
					"genre": [
						"Chiptune",
						"8-bit",
						"Chipstep"
					],
					"sameAs": [
						"https://www.facebook.com/StressTN",
						"https://twitter.com/Stress_TN",
						"https://vk.com/club14953852",
						"https://www.discogs.com/artist/2925002",
						"https://plus.google.com/109842483321855282635",
						"https://soundcloud.com/stress_tn",
						"https://www.youtube.com/user/stresstn"
					]
				};
				var script = document.createElement('script');
				script.type = 'application/ld+json';
				script.innerHTML = JSON.stringify( data );
				document.getElementsByTagName('head')[0].appendChild(script);
			})(document);
		</script>
	</head>
	<body>
		<div class="wrapper">
			<div id="animation" class="disactive"></div>
			<div id="root"></div>
			<noscript>Please install normal browser</noscript>
		</div>
		<script type="module" src="/src/index.js"></script>
	</body>
</html>
