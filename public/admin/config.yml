# Decap CMS config — S_TN Admin Panel
# Документация: https://decapcms.org/docs/

backend:
  name: git-gateway
  branch: main   # Измените на master, если ваша основная ветка называется master

# Папка для загрузки картинок через админку
media_folder: public/images/albums
public_folder: ../images/albums

locale: en

collections:
  - name: "site_data"
    label: "Данные сайта"
    files:

      # ─────────────────────────────────────────────────────────────
      # ОСНОВНОЙ ФАЙЛ — public/data.json
      # ─────────────────────────────────────────────────────────────
      - name: "main"
        label: "Основной контент"
        file: "public/data.json"
        format: json
        fields:

          # ── Видимость секций ─────────────────────────────────────
          - label: "Видимые секции"
            name: "visibleSections"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Bio",          name: "bio",          widget: "boolean", default: true }
              - { label: "Новости",      name: "news",         widget: "boolean", default: true }
              - { label: "Дискография",  name: "discography",  widget: "boolean", default: true }
              - { label: "Game",         name: "game",         widget: "boolean", default: true }
              - { label: "Player",       name: "player",       widget: "boolean", default: true }
              - { label: "События",      name: "events",       widget: "boolean", default: true }
              - { label: "Донат",        name: "donate",       widget: "boolean", default: false }
              - { label: "Контакты",     name: "contacts",     widget: "boolean", default: true }
              - { label: "Mup",          name: "mup",          widget: "boolean", default: true }
              - { label: "Эмулятор",     name: "emulator",     widget: "boolean", default: true }
              - { label: "Kits",         name: "kits",         widget: "boolean", default: true }

          # ── Bio ──────────────────────────────────────────────────
          - label: "Bio (HTML)"
            name: "bio"
            widget: "text"
            hint: "Поддерживает HTML-теги: <p>, <b>, <i>, <a href=\"...\">, и т.д."

          # ── Новости ──────────────────────────────────────────────
          - label: "Новости"
            name: "news"
            widget: "list"
            label_singular: "Новость"
            summary: "{{fields.title}} — {{fields.description}}"
            fields:
              - { label: "Показывать",  name: "show",        widget: "boolean", default: true }
              - { label: "Дата (Unix timestamp)", name: "date", widget: "number", value_type: "int",
                  hint: "Конвертер: https://www.unixtimestamp.com/" }
              - { label: "Заголовок",   name: "title",       widget: "string" }
              - { label: "Описание",    name: "description", widget: "text" }
              - { label: "Ссылка",      name: "link",        widget: "string" }
              - label: "Тип медиа"
                name: "type"
                widget: "select"
                options: ["image", "video", "text"]
              - { label: "Медиа (путь к картинке или URL видео)", name: "media",
                  widget: "string", required: false }

          # ── Дискография ──────────────────────────────────────────
          - label: "Дискография"
            name: "discography"
            widget: "list"
            label_singular: "Релиз"
            summary: "{{fields.title}} ({{fields.year}}) — {{fields.type}}"
            fields:
              - { label: "Показывать",    name: "show",         widget: "boolean", default: true }
              - label: "Тип релиза"
                name: "type"
                widget: "select"
                options: ["album", "single"]
              - { label: "Название",       name: "title",        widget: "string" }
              - { label: "Автор",          name: "author",       widget: "string" }
              - { label: "Год",            name: "year",         widget: "string" }
              - { label: "Bandcamp Album ID", name: "bandcampAlbum",
                  widget: "number", value_type: "int", required: false,
                  hint: "Число из URL плеера Bandcamp (album=XXXXXXXXX)" }
              - { label: "Bandcamp Track ID", name: "bandcampTrack",
                  widget: "number", value_type: "int", required: false,
                  hint: "Число из URL плеера Bandcamp (track=XXXXXXXXX)" }
              - { label: "SoundCloud Player ID", name: "soundcloudPlayer",
                  widget: "string", required: false }
              - { label: "Название лейбла", name: "labelName",  widget: "string", required: false }
              - { label: "Сайт лейбла",     name: "labelLink",  widget: "string", required: false }
              - { label: "Release ID",       name: "releaseId",  widget: "string", required: false }
              - { label: "Путь к обложке",  name: "coverLink",  widget: "string",
                  hint: "Напр.: ../images/albums/myalbum.jpg" }
              - { label: "Ссылка для скачивания", name: "downloadLink", widget: "string" }
              - label: "Трек-лист"
                name: "tracklist"
                widget: "list"
                field:
                  label: "Трек"
                  name: "track"
                  widget: "string"

          # ── События ──────────────────────────────────────────────
          - label: "События / Концерты"
            name: "events"
            widget: "list"
            label_singular: "Событие"
            summary: "{{fields.date}} — {{fields.title}} ({{fields.city}})"
            fields:
              - { label: "Дата",     name: "date",    widget: "string",
                  hint: "Напр.: 21 February 2026" }
              - { label: "Страна",   name: "country", widget: "string" }
              - { label: "Город",    name: "city",    widget: "string" }
              - { label: "Название", name: "title",   widget: "string" }
              - { label: "Ссылка",   name: "link",    widget: "string", required: false }

