<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: rounded square, jet-black -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0d0d0d"/>

  <!-- Gameboy body -->
  <rect x="146" y="60" width="220" height="320" rx="36" ry="36" fill="none" stroke="#39ff14" stroke-width="10"/>

  <!-- Screen bezel -->
  <rect x="168" y="90" width="176" height="130" rx="10" ry="10" fill="#111" stroke="#39ff14" stroke-width="6"/>

  <!-- Screen inner (green LCD) -->
  <rect x="182" y="104" width="148" height="102" rx="6" ry="6" fill="#0a2a0a"/>
  <!-- Screen glare -->
  <rect x="188" y="110" width="40" height="14" rx="4" ry="4" fill="#39ff14" opacity="0.18"/>

  <!-- Speaker dots (right side) -->
  <circle cx="330" cy="120" r="5" fill="#39ff14" opacity="0.7"/>
  <circle cx="330" cy="138" r="5" fill="#39ff14" opacity="0.7"/>
  <circle cx="330" cy="156" r="5" fill="#39ff14" opacity="0.7"/>
  <circle cx="344" cy="128" r="5" fill="#39ff14" opacity="0.7"/>
  <circle cx="344" cy="146" r="5" fill="#39ff14" opacity="0.7"/>

  <!-- D-pad vertical -->
  <rect x="184" y="258" width="20" height="56" rx="4" ry="4" fill="#39ff14"/>
  <!-- D-pad horizontal -->
  <rect x="170" y="272" width="48" height="20" rx="4" ry="4" fill="#39ff14"/>
  <!-- D-pad center dot -->
  <circle cx="194" cy="281" r="7" fill="#0d0d0d" opacity="0.4"/>

  <!-- A button -->
  <circle cx="318" cy="272" r="18" fill="#39ff14"/>
  <text x="318" y="278" text-anchor="middle" font-family="monospace" font-size="16" fill="#0d0d0d" font-weight="bold">A</text>

  <!-- B button -->
  <circle cx="282" cy="292" r="18" fill="#39ff14" opacity="0.6"/>
  <text x="282" y="298" text-anchor="middle" font-family="monospace" font-size="16" fill="#0d0d0d" font-weight="bold">B</text>

  <!-- SELECT / START buttons -->
  <rect x="196" y="330" width="36" height="10" rx="5" ry="5" fill="#39ff14" opacity="0.5"/>
  <rect x="246" y="330" width="36" height="10" rx="5" ry="5" fill="#39ff14" opacity="0.5"/>

  <!-- Label under screen -->
  <text x="256" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#39ff14" opacity="0.6" letter-spacing="3">CMS</text>

  <!-- Bottom notch / battery -->
  <rect x="220" y="370" width="72" height="8" rx="4" ry="4" fill="#39ff14" opacity="0.25"/>
</svg>

