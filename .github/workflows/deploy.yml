name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch: # Ручной запуск через GitHub UI

# Разрешения для официального деплоя GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Запрещаем параллельные деплои
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Inject Netlify Identity URL
        run: |
          if [ -n "${{ secrets.NETLIFY_IDENTITY_URL }}" ]; then
            sed -i 's|__NETLIFY_IDENTITY_URL__|${{ secrets.NETLIFY_IDENTITY_URL }}|g' public/admin/index.html
            sed -i 's|__NETLIFY_IDENTITY_URL__|${{ secrets.NETLIFY_IDENTITY_URL }}|g' public/index.html
            echo "✅ Netlify Identity URL injected"
          else
            echo "⚠️  Secret NETLIFY_IDENTITY_URL not set, skipping"
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
