[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

[functions]
  directory = "netlify/functions"

# /admin и /admin/ — оба отдают React SPA (rewrite, force override файла)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200
  force = true

# SPA fallback для всех остальных маршрутов
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
