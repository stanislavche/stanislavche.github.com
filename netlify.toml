[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  # Добавь в Netlify → Site settings → Environment variables:
  #   VITE_GITHUB_OWNER  = твой_логин_github
  #   VITE_GITHUB_REPO   = название_репозитория
  #   VITE_GITHUB_BRANCH = main
  # Тогда data.json будет грузиться напрямую из GitHub Raw
  # и сайт НЕ будет пересобираться при каждом сохранении в админке.

[functions]
  directory = "netlify/functions"

# Проксируем /mup/* и /helloworld/* на GitHub Pages (отдельные репозитории)
[[redirects]]
  from = "/mup"
  to = "https://stanislavche.github.io/mup/"
  status = 200
  force = true

[[redirects]]
  from = "/mup/*"
  to = "https://stanislavche.github.io/mup/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/helloworld"
  to = "https://stanislavche.github.io/helloworld/"
  status = 200
  force = true

[[redirects]]
  from = "/helloworld/*"
  to = "https://stanislavche.github.io/helloworld/:splat"
  status = 200
  force = true

# SPA fallback — все пути отдают React index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
