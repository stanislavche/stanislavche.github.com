[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

[functions]
  directory = "netlify/functions"

# /admin/ → /admin (без косой черты = React SPA)
[[redirects]]
  from = "/admin/"
  to = "/admin"
  status = 301
  force = true

# SPA fallback — все остальные пути на index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
